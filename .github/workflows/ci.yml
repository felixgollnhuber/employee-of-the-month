name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    # The bridge targets Apple Silicon macOS. These checks never log in,
    # open the network, touch audio devices or place calls.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline checks and unit tests
        run: make check
      - name: Package and CLI smoke test
        run: |
          python -m pip install --no-deps -e .
          eotm --help >/dev/null
